name: CI GraalVM
on:
  push:
    branches: ["master"]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish_snapshot:
        description: "Publish the libraries in the graalvm-snapshot pre-release"
        type: boolean
        default: false
jobs:
  build:
    name: H2GIS on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ macos-latest, windows-latest, ubuntu-latest ]
    steps:
      - uses: actions/checkout@v4
      
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'mandrel'
          version: 'mandrel-latest'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image-job-reports: 'true'

      - name: H2GIS build
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
          
      - name: H2GIS maven build
        run: mvn clean install -DskipTests && mvn native:compile -Pnative -pl h2gis-graalvm -DskipTests
      
      - name: Set OS name
        id: os-name
        shell: bash
        run: |
          if [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            echo "os=linux" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" == "macos-latest" ]; then
            echo "os=macos" >> $GITHUB_OUTPUT
          elif [ "${{ matrix.os }}" == "windows-latest" ]; then
            echo "os=windows" >> $GITHUB_OUTPUT
          fi
      
      - name: Copy compiled libraries
        shell: bash
        run: |
          mkdir -p upload-libs
          # Copier UNIQUEMENT les fichiers h2gis.so, h2gis.dll, h2gis.dylib
          find h2gis-graalvm/target -type f \( -name "h2gis.so" -o -name "h2gis.dylib" -o -name "h2gis.dll" \) -exec cp {} upload-libs/ \; 2>/dev/null || true
          echo "Libraries found for ${{ steps.os-name.outputs.os }}:"
          ls -lh upload-libs/
      
      - name: Upload libraries for combining
        uses: actions/upload-artifact@v4
        with:
          name: libs-${{ steps.os-name.outputs.os }}
          path: upload-libs/
          retention-days: 1

  create_combined_archive:
    name: Create combined libraries archive
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all library artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libs-*
          path: all-libraries
          merge-multiple: true
      
      - name: List downloaded libraries
        run: |
          echo "All libraries downloaded:"
          ls -lh all-libraries/
      
      - name: Create combined zip
        run: |
          # Créer le zip directement avec les fichiers (pas de répertoire parent)
          cd all-libraries
          zip ../h2gis-graalvm-all-platforms.zip h2gis.so h2gis.dll h2gis.dylib 2>/dev/null || true
          cd ..
          echo "Archive created:"
          ls -lh h2gis-graalvm-all-platforms.zip
          echo "Archive contents:"
          unzip -l h2gis-graalvm-all-platforms.zip
      
      - name: Upload combined archive
        uses: actions/upload-artifact@v4
        with:
          name: h2gis-graalvm-all-platforms
          path: h2gis-graalvm-all-platforms.zip
          retention-days: 90


  # Publishes the libraries on GitHub, where other projects (the GDAL driver
  # h2gis-gdal, h2gis-python) download them from a fixed URL:
  # - a push on master updates the pre-release "graalvm-snapshot", as a manual
  #   run with publish_snapshot checked, from any branch;
  # - a tag v*.*.* attaches them to the release of the tag.
  # Each library is named after its platform (h2gis-linux-x86_64.so...), and
  # the combined archive keeps the original names.
  publish:
    name: Publish the libraries
    # After the combined archive: the temporary artifacts are deleted here
    needs: [build, create_combined_archive]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the libraries
        uses: actions/download-artifact@v4
        with:
          pattern: libs-*
          path: libs
      - name: Name the libraries after their platform
        run: |
          mkdir dist
          cp libs/libs-linux/h2gis.so dist/h2gis-linux-x86_64.so
          cp libs/libs-windows/h2gis.dll dist/h2gis-windows-x86_64.dll
          # macos-latest runs on Apple Silicon
          cp libs/libs-macos/h2gis.dylib dist/h2gis-macos-arm64.dylib
          (cd libs && zip -j ../dist/h2gis-graalvm-all-platforms.zip libs-*/h2gis.*)
          (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - name: Snapshot pre-release (master, or manual run)
        if: github.ref == 'refs/heads/master' || inputs.publish_snapshot
        run: |
          notes="H2GIS native libraries (GraalVM native image), built from ${GITHUB_SHA} (branch ${GITHUB_REF_NAME}) on $(date -u +%Y-%m-%d). Replaced at each push on master."
          if ! gh release view graalvm-snapshot > /dev/null 2>&1; then
            gh release create graalvm-snapshot --prerelease --target "${GITHUB_SHA}" \
              --title "H2GIS native libraries (snapshot)" --notes "$notes"
          else
            gh release edit graalvm-snapshot --notes "$notes"
          fi
          gh release upload graalvm-snapshot dist/* --clobber
      - name: Release of the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            gh release create "$tag" --verify-tag --title "$tag" --generate-notes
          fi
          gh release upload "$tag" dist/* --clobber
      - name: Delete temporary library artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          name: libs-*
